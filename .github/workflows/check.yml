name: Check Linux and macOS workloads
on: [push, pull_request, workflow_dispatch]
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU PyTorch on Linux
        if: runner.os == 'Linux'
        run: python -m pip install -r requirements.txt --index-url https://download.pytorch.org/whl/cpu
      - name: Install PyTorch on macOS
        if: runner.os == 'macOS'
        run: python -m pip install -r requirements.txt
      - name: Check all four workloads and trace hierarchy
        run: python scripts/smoke_test.py
